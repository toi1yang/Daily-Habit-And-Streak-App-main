<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streakify - Daily Habit & Streak Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center p-4 sm:p-6">

  <!-- Header -->
  <header class="w-full max-w-lg flex justify-between items-center my-4">
    <div>
      <h1 class="text-3xl font-extrabold text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-fire text-amber-500"></i> Streakify
      </h1>
      <p class="text-xs text-slate-400 mt-1">Small steps every day lead to big changes.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" title="Export Data" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
        <i class="fa-solid fa-download"></i>
      </button>
      <button onclick="document.getElementById('importFile').click()" title="Import Data" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
        <i class="fa-solid fa-upload"></i>
      </button>
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
    </div>
  </header>

  <main class="w-full max-w-lg space-y-6">

    <!-- Progress Card -->
    <div class="glass p-5 rounded-2xl shadow-xl">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-semibold text-slate-300">Today's Progress</span>
        <span id="progressPercent" class="text-sm font-bold text-indigo-400">0%</span>
      </div>
      <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-500 ease-out"></div>
      </div>
    </div>

    <!-- Input Form -->
    <form onsubmit="addHabit(event)" class="glass p-4 rounded-2xl flex flex-col sm:flex-row gap-2">
      <input type="text" id="habitInput" placeholder="Enter a new habit..." required 
        class="flex-1 bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
      
      <select id="categoryInput" class="bg-slate-900/60 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-300">
        <option value="Health">Health</option>
        <option value="Work">Work</option>
        <option value="Mind">Mind</option>
        <option value="Personal">Personal</option>
      </select>

      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus"></i> Add
      </button>
    </form>

    <!-- Filter Pills -->
    <div class="flex gap-2 overflow-x-auto pb-1" id="filterContainer">
      <button onclick="setFilter('All')" class="filter-btn active-filter px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">All</button>
      <button onclick="setFilter('Health')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">Health</button>
      <button onclick="setFilter('Work')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">Work</button>
      <button onclick="setFilter('Mind')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">Mind</button>
      <button onclick="setFilter('Personal')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">Personal</button>
    </div>

    <!-- Habit List -->
    <div id="habitList" class="space-y-3">
      <!-- Dynamic habits load here -->
    </div>

  </main>

  <script>
    let habits = JSON.parse(localStorage.getItem('streakify_habits')) || [
      { id: 1, name: 'Drink 2L Water', category: 'Health', streak: 3, completedDates: [getTodayString()], journal: '' }
    ];
    let currentFilter = 'All';

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function saveHabits() {
      localStorage.setItem('streakify_habits', JSON.stringify(habits));
      render();
    }

    function addHabit(e) {
      e.preventDefault();
      const input = document.getElementById('habitInput');
      const category = document.getElementById('categoryInput').value;
      if (!input.value.trim()) return;

      habits.push({
        id: Date.now(),
        name: input.value.trim(),
        category: category,
        streak: 0,
        completedDates: [],
        journal: ''
      });

      input.value = '';
      saveHabits();
    }

    function toggleHabit(id) {
      const today = getTodayString();
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      const isCompleted = habit.completedDates.includes(today);
      if (isCompleted) {
        habit.completedDates = habit.completedDates.filter(d => d !== today);
        habit.streak = Math.max(0, habit.streak - 1);
      } else {
        habit.completedDates.push(today);
        habit.streak += 1;
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
      }

      saveHabits();
    }

    function deleteHabit(id) {
      habits = habits.filter(h => h.id !== id);
      saveHabits();
    }

    function updateJournal(id, note) {
      const habit = habits.find(h => h.id === id);
      if (habit) {
        habit.journal = note;
        localStorage.setItem('streakify_habits', JSON.stringify(habits));
      }
    }

    function setFilter(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.innerText === cat) {
          btn.className = 'filter-btn active-filter px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white';
        } else {
          btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700';
        }
      });
      render();
    }

    function render() {
      const today = getTodayString();
      const listEl = document.getElementById('habitList');
      listEl.innerHTML = '';

      const filtered = habits.filter(h => currentFilter === 'All' || h.category === currentFilter);

      // Update progress bar
      const total = habits.length;
      const completedToday = habits.filter(h => h.completedDates.includes(today)).length;
      const pct = total === 0 ? 0 : Math.round((completedToday / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressPercent').innerText = pct + '%';

      if (filtered.length === 0) {
        listEl.innerHTML = <p class="text-center text-slate-500 py-8 text-sm">No habits found. Add one above!</p>;
        return;
      }

      // Past 7 Days List for History Matrix
      const last7Days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        last7Days.push(d.toISOString().split('T')[0]);
      }

      filtered.forEach(habit => {
        const isDone = habit.completedDates.includes(today);

        const card = document.createElement('div');
        card.className = glass p-4 rounded-2xl transition ${isDone ? 'border-indigo-500/40 bg-indigo-950/20' : ''};

        card.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button onclick="toggleHabit(${habit.id})" class="w-7 h-7 rounded-lg border ${isDone ? 'bg-indigo-600 border-indigo-500 text-white' : 'border-slate-600 hover:border-indigo-400'} flex items-center justify-center transition">
                ${isDone ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
              </button>
              <div>
                <h3 class="font-semibold text-sm ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}">${habit.name}</h3>
                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-medium">${habit.category}</span>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="text-right">
                <span class="text-xs font-bold text-amber-500 flex items-center gap-1">
                  <i class="fa-solid fa-fire"></i> ${habit.streak}
                </span>
              </div>
              <button onclick="deleteHabit(${habit.id})" class="text-slate-600 hover:text-rose-400 transition text-xs p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>

          <!-- 7-Day History Matrix -->
          <div class="mt-4 pt-3 border-t border-slate-800/80 flex justify-between items-center">
            <span class="text-[11px] text-slate-500">7-Day History:</span>
            <div class="flex gap-1.5">
              ${last7Days.map(day => {
                const checked = habit.completedDates.includes(day);
                const dayLetter = new Date(day).toLocaleDateString('en-US', { weekday: 'narrow' });
                return `
                  <div class="flex flex-col items-center gap-1">
                    <div class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] font-bold ${checked ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-600'}">
                      ${checked ? '✓' : ''}
                    </div>
                    <span class="text-[9px] text-slate-500">${dayLetter}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Journal Note Area -->
          <div class="mt-3">
            <input type="text" placeholder="Add daily note or reflections..." 
              value="${habit.journal || ''}" 
              onchange="updateJournal(${habit.id}, this.value)"
              class="w-full bg-slate-900/40 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 placeholder-slate-600 focus:outline-none focus:border-slate-700">
          </div>
        `;

        listEl.appendChild(card);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(habits));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "streakify_backup.json");
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            habits = imported;
            saveHabits();
          }
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
